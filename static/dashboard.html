<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Bank Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #1a3c6e; margin-bottom: 20px; text-align: center; }
        .account-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .account-card p { margin-bottom: 8px; }
        input { width: 60%; padding: 8px; margin-right: 5px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 8px 15px; background-color: #1a3c6e; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #14305a; }
        .top-buttons { text-align: right; margin-bottom: 20px; }
        #message { margin-top: 15px; padding: 10px; background: white; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="profile-info" style="text-align:center; margin-bottom:15px; color:#666;"></div>

        
        <div class="account-card" style="text-align:center;">
            <h2>Total Balance</h2>
            <h1 id="total-balance" style="color:#1a3c6e;">Rs. 0</h1>
        </div>
        
        <div class="top-buttons">
            <button onclick="window.location.href='transaction.html'">📜 Transaction History</button>
            <button onclick="window.location.href='admin.html'">🛡️ Admin Panel</button>
            <button onclick="logout()">🚪 Logout</button>
        </div>

        <div class="account-card">
        <h2>Create New Account</h2>
        <select id="new-account-type" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;">
            <option value="savings">Savings</option>
            <option value="current">Current</option>
        </select>
        <button onclick="createAccount()">➕ Create Account</button>
        </div>


        <h1>Your Accounts</h1>
        <div id="accounts-list"></div>

        <p id="message"></p>
        <div class="account-card">
            <h2>Transfer Money</h2>
            <input type="number" id="from-account" placeholder="From Account ID">
            <input type="number" id="to-account" placeholder="To Account ID">
            <input type="number" id="transfer-amount" placeholder="Amount">
            <button onclick="transferMoney()">🔄 Transfer</button>
        </div>

    </div>

    

    <script>
        async function loadProfile() {
        const token = localStorage.getItem("token");
        const response = await fetch("/profile", {
            headers: { "Authorization": "Bearer " + token }
        });
        const user = await response.json();
        document.getElementById("profile-info").innerText = `Welcome, ${user.name} (${user.email})`;
        }



        
        async function loadAccounts() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "index.html";
                return;
            }
            const balanceResponse = await fetch("/accounts/summary/total-balance", {
                headers: { "Authorization": "Bearer " + token }
            });
            const balanceData = await balanceResponse.json();
            document.getElementById("total-balance").innerText = `Rs. ${balanceData.total_balance}`;

            const response = await fetch("/accounts", {
                headers: { "Authorization": "Bearer " + token }
            });
            const accounts = await response.json();

            let html = "";
            accounts.forEach(acc => {
                html += `
                    <div class="account-card">
                        <p><strong>${acc.account_type}</strong> (${acc.account_number})</p>
                        <p>Balance: Rs. ${acc.balance}</p>
                        <input type="number" id="amount-${acc.id}" placeholder="Amount">
                        <button onclick="deposit(${acc.id})">💰 Deposit</button>
                        <button onclick="withdraw(${acc.id})">💸 Withdraw</button>
                        <button onclick="closeAccount(${acc.id})">❌ Close Account</button>
                    </div>
                `;
            });
            document.getElementById("accounts-list").innerHTML = html;
        }

        async function deposit(accountId) {
            const amount = document.getElementById(`amount-${accountId}`).value;
            const token = localStorage.getItem("token");

            const response = await fetch(`/accounts/${accountId}/deposit`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ amount: parseFloat(amount) })
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById("message").innerText = "Deposit successful!";
                loadAccounts();
            } else {
                document.getElementById("message").innerText = JSON.stringify(data);
            }
        }

        async function withdraw(accountId) {
            const amount = document.getElementById(`amount-${accountId}`).value;
            const token = localStorage.getItem("token");

            const response = await fetch(`/accounts/${accountId}/withdraw`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ amount: parseFloat(amount) })
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById("message").innerText = "Withdraw successful!";
                loadAccounts();
            } else {
                document.getElementById("message").innerText = JSON.stringify(data);
            }
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }

        window.onload = function() {
            loadProfile();
            loadAccounts();
        };


        async function transferMoney() {
            const fromId = document.getElementById("from-account").value;
            const toId = document.getElementById("to-account").value;
            const amount = document.getElementById("transfer-amount").value;
            const token = localStorage.getItem("token");

            const response = await fetch("/transfer", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    from_account_id: parseInt(fromId),
                    to_account_id: parseInt(toId),
                    amount: parseFloat(amount)
                })
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById("message").innerText = "Transfer successful!";
                loadAccounts();
            } 
            else {
                document.getElementById("message").innerText = JSON.stringify(data);
            }
        }


        async function closeAccount(accountId) {
        const token = localStorage.getItem("token");
        const response = await fetch(`/accounts/${accountId}`, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();
        document.getElementById("message").innerText = JSON.stringify(data);
        loadAccounts();
        }


        async function loadProfile() {
        const token = localStorage.getItem("token");
        const response = await fetch("/profile", {
            headers: { "Authorization": "Bearer " + token }
        });
        const user = await response.json();
        document.getElementById("profile-info").innerText = `Welcome, ${user.name} (${user.email})`;
        }

        async function createAccount() {
            const accountType = document.getElementById("new-account-type").value;
            const token = localStorage.getItem("token");

            const response = await fetch("/accounts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ account_type: accountType })
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById("message").innerText = "Account created successfully!";
                loadAccounts();
            } 
            else {
                document.getElementById("message").innerText = JSON.stringify(data);
            }
        }

    </script>
</body>
</html>
